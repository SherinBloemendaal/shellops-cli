<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ShellOps: DevOps for your Compose + PHP project, from the shell">
  <title>ShellOps: DevOps for your Compose + PHP project, from the shell</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010402"/><stop offset="1" stop-color="#04100A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#166534" stop-opacity="0.95"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow1"><stop offset="0" stop-color="#4ADE80" stop-opacity="0.14"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#166534" stop-opacity="0.14"/><stop offset="1" stop-color="#166534" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#22C55E" fill-opacity="0.06"/>
    </pattern>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.35"/>
    </pattern>
    <filter id="phosphor" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1280" height="360" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
