name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          if [ "${USE_CROSS}" = "true" ]; then
            cross build --release --target "${TARGET}"
          else
            cargo build --release --target "${TARGET}"
          fi

      - name: Package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/so-stage"
          rm -rf "${stage}"
          mkdir -p "${stage}" dist
          cp "target/${TARGET}/release/so" "${stage}/so"
          chmod 755 "${stage}/so"
          cp README.md LICENSE "${stage}/"
          export COPYFILE_DISABLE=1
          tar -czf "dist/so-${TARGET}.tar.gz" -C "${stage}" \
            so README.md LICENSE

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: so-${{ matrix.target }}
          path: dist/so-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          expected=(
            so-aarch64-apple-darwin.tar.gz
            so-x86_64-apple-darwin.tar.gz
            so-x86_64-unknown-linux-musl.tar.gz
            so-aarch64-unknown-linux-musl.tar.gz
          )
          for name in "${expected[@]}"; do
            if [ ! -f "${name}" ]; then
              echo "missing release asset: ${name}" >&2
              ls -la
              exit 1
            fi
          done
          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
          files: |
            artifacts/so-aarch64-apple-darwin.tar.gz
            artifacts/so-x86_64-apple-darwin.tar.gz
            artifacts/so-x86_64-unknown-linux-musl.tar.gz
            artifacts/so-aarch64-unknown-linux-musl.tar.gz
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
