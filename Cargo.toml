[package]
name = "shellops"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Docker, PHP, and release CLI"
license = "MIT"
repository = "https://github.com/SherinBloemendaal/shellops-cli"

[[bin]]
name = "so"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
owo-colors = "4"
console = "0.16"
comfy-table = "7"
indicatif = "0.18"
dialoguer = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
semver = "1"
flate2 = "1"
tar = "0.4"
tempfile = "3"
chrono = "0.4"
dotenvy = "0.15"
rustix = { version = "1.1.5", features = ["process"] }

[dev-dependencies]
tempfile = "3"
